<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タグ | 世界中のねこちゃ～ん</title>
  <meta name="description" content="世界中の猫のショート動画を、タグごとに見られるページです。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐱%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="tag">
<!-- このファイルは「タグごとのページ」の共通ひな形です。
     tag.html?tag=三毛猫 のように、? の後ろのタグ名で表示する動画が切り替わります。 -->

  <header class="site-header">
    <a class="logo" href="index.html"><span class="logo__icon" aria-hidden="true">🐱</span><span>世界中のねこちゃ～ん</span></a>
  </header>

  <main class="container">
    <p><a class="btn btn--ghost btn--small" href="index.html">← トップへもどる</a></p>

    <h1 id="tag-title" class="tag-title">#</h1>
    <p id="tag-sub" class="tag-sub"></p>

    <form id="search-form" class="search" role="search">
      <span class="search__icon" aria-hidden="true">🔍</span>
      <input id="search-input" class="search__input" type="search" autocomplete="off"
             placeholder="このタグの中で探す" aria-label="このタグの中で探す">
    </form>

    <p id="check" class="check" hidden></p>

    <div id="toolbar" class="toolbar">
      <h2 id="result-count" class="result-count"></h2>
      <div class="view-toggle" role="group" aria-label="ならべ方">
        <button type="button" class="view-toggle__btn" data-view="compact" aria-pressed="false">▦ 小さく並べる</button>
        <button type="button" class="view-toggle__btn" data-view="full" aria-pressed="false">▭ 大きく見る</button>
      </div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>
      <span class="empty__icon" aria-hidden="true">🙀</span>
      <span id="empty-msg"></span>
    </div>
    <div class="more-wrap"><button id="more" class="btn btn--ghost" type="button" hidden></button></div>

    <section id="tags-section">
      <h2 class="section-title">ほかのタグ</h2>
      <div id="tag-list" class="chips"></div>
    </section>

    <noscript><p class="empty">このサイトを見るには、JavaScript を有効にしてください。</p></noscript>
  </main>

  <footer class="site-footer container">
    <p>動画は各SNSの公式の埋め込み機能で表示しています。<br>動画の権利は、それぞれの投稿者にあります。</p>
  </footer>

  <script src="videos.js"></script>
  <script src="app.js"></script>
</body>
</html>
